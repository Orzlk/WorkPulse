name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.0.1'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            os: macos-latest
            command: npm run dist:mac -- --x64 --publish never
          - name: macOS-arm64
            os: macos-latest
            command: npm run dist:mac -- --arm64 --publish never
          - name: Windows-x64
            os: windows-latest
            command: npm run dist:win -- --publish never
          - name: Linux-x64
            os: ubuntu-22.04
            command: npm run dist:linux -- --publish never

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog for release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 提取 CHANGELOG.md 中 "## vX.Y.Z" 段落（到下一个二级标题为止）作为发布说明
          awk -v ver="v$version" '
            $0 ~ "^## " ver { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "本次变更详见下方自动生成的提交列表。" > release-notes.md
          fi
          cat release-notes.md

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.zip' -o \
            -name '*.blockmap' -o \
            -name '*.yml' \
          \) ! -name '*.dmg.blockmap' -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -gt 0
          find release-assets -maxdepth 1 -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: WorkPulse ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup intermediate artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].id' | while read -r id; do
              if [ -n "$id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
              fi
            done
